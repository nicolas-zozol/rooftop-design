<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Rooftop, Blueprint sur le tapis de jeu</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/rooftop/tokens.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:wght@700;800&amp;family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width:1440px;height:{{H}}px;box-sizing:border-box;display:flex;flex-direction:column;overflow:hidden;background:var(--surface);color:var(--encre);font-family:var(--font-sans);font-size:13px;line-height:1.35">

<header style="height:48px;flex:none;box-sizing:border-box;display:flex;align-items:center;gap:16px;padding:0 12px 0 14px;border-bottom:1px solid var(--ligne);background:var(--surface)">
<nav aria-label="Vues" style="display:flex;gap:2px;padding:3px;border-radius:9px;background:var(--surface-creuse)">
<a href="#questions" style="display:flex;align-items:center;height:28px;padding:0 12px;border-radius:7px;color:var(--encre-muette);font-size:13px;font-weight:500;text-decoration:none">Questions</a>
<a href="#blueprint" aria-current="page" style="display:flex;align-items:center;height:28px;padding:0 12px;border-radius:7px;background:var(--surface);color:var(--encre);font-size:13px;font-weight:500;text-decoration:none;box-shadow:var(--ombre-carte)">Blueprint</a>
</nav>
<span style="flex:1"></span>
<div style="display:flex;align-items:center;gap:12px;font-size:12px;color:var(--encre-2)">
<span style="font-family:{{M}};font-size:11.5px;color:var(--encre);padding:3px 8px;border-radius:6px;background:var(--surface-creuse);border:1px solid var(--ligne)">epic/rooftop-batches-epic</span>
<span>37 fichiers à commiter</span>
<span aria-hidden="true" style="width:1px;height:16px;background:var(--ligne)"></span>
<span>20 commits à pousser</span>
<span style="display:flex;align-items:center;gap:2px;height:26px;box-sizing:border-box;padding:0 2px 0 8px;border-radius:6px;border:1px solid var(--ligne);background:var(--surface-creuse)"><code style="font-family:{{M}};font-size:11.5px;color:var(--encre-2)">git push</code><button type="button" aria-label="Copier git push" style="width:22px;height:22px;padding:0;display:flex;align-items:center;justify-content:center;border:0;border-radius:5px;background:transparent;color:var(--encre-muette);cursor:pointer"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"><rect x="4.6" y="4.6" width="7.2" height="7.2" rx="1.6"></rect><path d="M9.4 4.6v-.8a1.6 1.6 0 0 0-1.6-1.6h-4a1.6 1.6 0 0 0-1.6 1.6v4a1.6 1.6 0 0 0 1.6 1.6h.8"></path></svg></button></span>
<span aria-hidden="true" style="width:1px;height:16px;background:var(--ligne)"></span>
<span>intégration : <span style="font-family:{{M}};font-size:11.5px;color:var(--encre)">main</span></span>
<button type="button" style="height:28px;padding:0 10px;border-radius:7px;border:1px solid var(--ligne);background:var(--surface);color:var(--encre);font-family:inherit;font-size:12px;font-weight:500;cursor:pointer;box-shadow:var(--ombre-carte)">Relire git</button>
</div>
</header>

<main aria-label="Plan" style="flex:1;min-height:0;position:relative;overflow:hidden;background-color:var(--surface-plan);background-image:radial-gradient(var(--surface-plan-point) 1px, transparent 1.3px);background-size:18px 18px">

<div style="position:absolute;left:16px;top:16px;display:flex;gap:8px;z-index:2">
<button type="button" style="height:30px;padding:0 12px;border-radius:7px;border:1px solid var(--ligne);background:var(--surface);color:var(--encre);font-family:inherit;font-size:12.5px;font-weight:500;cursor:pointer;box-shadow:var(--ombre-carte)">Tout replier</button>
<button type="button" style="height:30px;padding:0 12px;border-radius:7px;border:1px solid var(--ligne);background:var(--surface);color:var(--encre);font-family:inherit;font-size:12.5px;font-weight:500;cursor:pointer;box-shadow:var(--ombre-carte)">Dérouler les débloquées</button>
</div>

<sc-if value="{{isChemin}}" hint-placeholder-val="{{false}}"><div role="status" style="position:absolute;left:50%;top:14px;transform:translateX(-50%);z-index:3;display:flex;align-items:center;gap:10px;height:40px;box-sizing:border-box;padding:0 5px 0 16px;border-radius:999px;background:var(--inverse);color:var(--texte-inverse);font-size:12.5px;white-space:nowrap;box-shadow:0 10px 30px rgba(0,0,0,0.25)">
<span>Pour débloquer le design file de <span style="font-family:{{M}};font-weight:600">plugin-split</span>, soumettre :</span>
<span style="display:flex;align-items:center;gap:6px"><span style="width:20px;height:20px;border-radius:50%;background:var(--texte-inverse);color:var(--inverse);font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center">1</span><span style="font-family:{{M}};font-weight:600">B-TOOLMAN-1</span></span>
<span aria-hidden="true" style="opacity:0.6">→</span>
<span style="display:flex;align-items:center;gap:6px"><span style="width:20px;height:20px;border-radius:50%;background:var(--texte-inverse);color:var(--inverse);font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center">2</span><span style="font-family:{{M}};font-weight:600">B-TOOLMAN-2</span></span>
<button type="button" style="height:30px;margin-left:4px;padding:0 12px;border-radius:999px;border:0;background:var(--inverse-2);color:var(--texte-inverse);font-family:inherit;font-size:12px;font-weight:600;cursor:pointer">Quitter le chemin</button>
</div></sc-if>

<div style="position:absolute;left:32px;top:64px;display:flex;align-items:flex-start;gap:28px">

<section aria-label="Module RB Compound" style="flex:none;box-sizing:border-box;border-radius:14px;overflow:hidden;background:var(--surface-module);border:1px solid var(--ligne)">
<div style="background:var(--bandeau);color:var(--bandeau-texte)">
<div style="display:flex;align-items:center;gap:9px;height:40px;padding:0 14px">
<span style="display:flex;color:var(--bandeau-muet)"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="1.5" y="1.5" width="4.5" height="4.5" rx="1"></rect><rect x="8" y="1.5" width="4.5" height="4.5" rx="1"></rect><rect x="1.5" y="8" width="4.5" height="4.5" rx="1"></rect><rect x="8" y="8" width="4.5" height="4.5" rx="1"></rect></svg></span>
<span style="font-size:10px;font-weight:700;letter-spacing:0.08em;color:var(--bandeau-muet)">MODULE</span>
<span style="font-size:15px;font-weight:700;white-space:nowrap">RB Compound</span>
<span style="flex:1"></span>
<svg aria-hidden="true" width="12" height="12" viewBox="0 0 12 12" style="flex:none"><circle cx="6" cy="6" r="4.6" fill="none" stroke-width="1.5" style="stroke:var(--module-en-cours)"></circle><path d="M6 1.4A4.6 4.6 0 0 0 6 10.6Z" style="fill:var(--module-en-cours)"></path></svg>
<span style="font-size:12px;color:var(--bandeau-muet)">en cours</span>
<span title="Moyenne de ses six epics : 7, 6, 50, 0, 92 et 6 %" style="font-size:13px;font-weight:600">27 %</span>
</div>
<div style="height:4px;background:var(--bandeau-piste)"><div style="width:27%;height:4px;background:var(--bandeau-texte)"></div></div>
</div>
<div style="padding:16px;display:flex;flex-direction:column;align-items:flex-start;gap:20px">
<dc-import name="EpicPlateau" epic="plugin" mode="deroulee" ouvert="{{plOuvert}}" chemin="{{plChemin}}" hint-size="766px,206px"></dc-import>
<div style="display:flex;align-items:flex-start;gap:20px">
<dc-import name="EpicPlateau" epic="qualitygates" mode="deroulee" ouvert="" chemin="{{autre}}" hint-size="390px,206px"></dc-import>
<dc-import name="EpicPlateau" epic="worktree" mode="deroulee" ouvert="" chemin="{{autre}}" hint-size="278px,206px"></dc-import>
</div>
<div style="display:flex;align-items:flex-start;gap:20px">
<dc-import name="EpicPlateau" epic="pipeline" mode="repliee" ouvert="" chemin="{{autre}}" hint-size="240px,186px"></dc-import>
<div style="display:flex;align-items:flex-start">
<dc-import name="EpicPlateau" epic="batches" mode="repliee" ouvert="" chemin="{{autre}}" hint-size="240px,154px"></dc-import>
<div aria-hidden="true" style="width:20px;flex:none"></div>
<dc-import name="EpicPlateau" epic="rtworktrees" mode="repliee" ouvert="" chemin="{{autre}}" hint-size="240px,178px"></dc-import>
</div>
</div>
</div>
</section>

<div style="display:flex;flex-direction:column;align-items:flex-start;gap:28px">
<dc-import name="EpicPlateau" epic="toolman" mode="deroulee" ouvert="" chemin="{{tmChemin}}" hint-size="542px,250px"></dc-import>
<dc-import name="EpicPlateau" epic="trwg" mode="repliee" ouvert="" chemin="{{autre}}" hint-size="240px,228px"></dc-import>
</div>

</div>

<div style="position:absolute;right:16px;bottom:16px;z-index:2;display:flex;align-items:center;gap:2px;padding:3px;border-radius:10px;background:var(--surface);border:1px solid var(--ligne);box-shadow:var(--ombre-carte)">
<button type="button" aria-label="Dézoomer" style="width:28px;height:28px;padding:0;display:flex;align-items:center;justify-content:center;border:0;border-radius:7px;background:transparent;color:var(--encre-2);cursor:pointer"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M3.5 7h7"></path></svg></button>
<span style="min-width:44px;text-align:center;font-size:11.5px;color:var(--encre-2)">100 %</span>
<button type="button" aria-label="Zoomer" style="width:28px;height:28px;padding:0;display:flex;align-items:center;justify-content:center;border:0;border-radius:7px;background:transparent;color:var(--encre-2);cursor:pointer"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M3.5 7h7M7 3.5v7"></path></svg></button>
<span aria-hidden="true" style="width:1px;height:16px;margin:0 2px;background:var(--ligne)"></span>
<button type="button" style="height:28px;padding:0 10px;border:0;border-radius:7px;background:transparent;color:var(--encre-2);font-family:inherit;font-size:12px;font-weight:500;cursor:pointer">Cadrer</button>
</div>
</main>

<footer style="height:36px;flex:none;box-sizing:border-box;display:flex;align-items:center;gap:8px;padding:0 8px 0 16px;border-top:1px solid var(--ligne);background:var(--surface);font-size:12px;color:var(--encre-2)">
<span>3 documents écartés</span>
<span style="color:var(--encre-muette)">·</span>
<span>2 signalements</span>
<span style="flex:1"></span>
<button type="button" style="height:26px;display:flex;align-items:center;gap:6px;padding:0 8px;border:0;border-radius:6px;background:transparent;color:var(--encre-2);font-family:inherit;font-size:12px;font-weight:500;cursor:pointer">Ouvrir le tiroir<svg aria-hidden="true" width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 8.8 7 5.3l3.5 3.5"></path></svg></button>
</footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"vue":{"editor":"enum","options":["ouverture","chantier","chemin"],"default":"ouverture"},"$preview":{"width":1440,"height":920}}'>
class Component extends DCLogic {
  renderVals() {
    var vue = this.props.vue || 'ouverture';
    var chemin = vue === 'chemin';
    var ouvert = vue === 'ouverture' ? '' : 'B1';
    return {
      M: 'var(--font-mono)',
      H: vue === 'ouverture' ? 920 : 1160,
      isChemin: chemin,
      plOuvert: ouvert,
      plChemin: chemin ? 'cible' : '',
      plHint: ouvert ? '968px,880px' : '766px,206px',
      tmChemin: chemin ? 'etapes' : '',
      autre: chemin ? 'estompe' : '',
      autreOp: chemin ? 0.35 : 1
    };
  }
}
</script>
</body>
</html>
