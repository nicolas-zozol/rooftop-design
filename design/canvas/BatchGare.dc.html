<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Batch, piste D : une gare sur la ligne</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600;700&amp;family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="position:relative;width:{{w}}px;height:{{h}}px;flex:none;opacity:{{op}};color:{{K.fg}};font-family:Inter, system-ui, -apple-system, 'Segoe UI', sans-serif;font-size:13px;line-height:1.35">
<div style="width:100%;height:100%;box-sizing:border-box;border-radius:8px;background:{{cardBg}};border:{{cardBd}};box-shadow:{{cardSh}};overflow:hidden;display:flex;flex-direction:column">
<div style="height:{{bandH}}px;flex:none;background:{{bandBg}}"></div>

<sc-if value="{{open}}" hint-placeholder-val="{{true}}">
<div style="display:flex;align-items:center;gap:8px;height:34px;flex:none;padding:0 10px 0 9px">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 20 20" style="flex:none"><circle cx="10" cy="10" r="8.7" fill="none" stroke="{{K.acc}}" stroke-width="2" opacity="{{ringOp}}"></circle><circle cx="10" cy="10" r="5.4" fill="{{mkFill}}" stroke="{{mkStroke}}" stroke-width="2.4" stroke-dasharray="{{mkDash}}"></circle><path d="M7.7 10.2 9.3 11.7 12.4 8.5" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" opacity="{{checkOp}}"></path></svg>
<span style="font-family:{{M}};font-size:11px;font-weight:700;color:{{chipCol}};white-space:nowrap">{{chip}}</span>
<sc-if value="{{isTenu}}" hint-placeholder-val="{{false}}"><svg aria-hidden="true" width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="{{K.mu}}" stroke-width="1.3" stroke-linecap="round" style="flex:none"><rect x="2.6" y="5.3" width="6.8" height="4.9" rx="1.2"></rect><path d="M4.2 5.3V4a1.8 1.8 0 0 1 3.6 0v1.3"></path></svg></sc-if>
<span style="font-family:{{Z}};font-size:14.5px;font-weight:600;color:{{wordCol}};white-space:nowrap">{{word}}</span>
<span style="flex:1"></span>
<sc-if value="{{hasMini}}" hint-placeholder-val="{{true}}"><span role="img" aria-label="{{miniLabel}}" style="display:flex;gap:2px"><sc-for list="{{mini}}" as="m" hint-placeholder-count="4"><span style="width:10px;height:5px;border-radius:1.5px;background:{{m.bg}}"></span></sc-for></span></sc-if>
<span style="font-family:{{Z}};font-size:13.5px;font-weight:500;color:{{K.mu}};white-space:nowrap">{{count}}</span>
<sc-if value="{{hasBlock}}" hint-placeholder-val="{{false}}"><span style="display:flex;align-items:center;gap:4px;font-size:11px;font-weight:500;color:{{K.blkT}};white-space:nowrap"><svg aria-hidden="true" width="10" height="10" viewBox="0 0 12 12" style="flex:none"><circle cx="6" cy="6" r="5.6" fill="{{K.blk}}"></circle><rect x="3" y="5.1" width="6" height="1.8" rx="0.9" fill="#ffffff"></rect></svg>{{blockLabel}}</span></sc-if>
</div>
<sc-if value="{{hasEntete}}" hint-placeholder-val="{{false}}"><p style="margin:0;height:22px;flex:none;padding:0 10px 0 37px;font-family:{{Z}};font-size:13.5px;font-weight:500;color:{{K.mu}}">{{entete}}</p></sc-if>
<div style="display:flex;flex-direction:column;padding:0 4px 6px">
<sc-for list="{{rows}}" as="s" hint-placeholder-count="4"><div style="display:flex;align-items:center;gap:10px;height:26px;padding:0 8px;opacity:{{s.op}}"><sc-if value="{{s.aside}}" hint-placeholder-val="{{false}}"><span style="width:48px;flex:none;font-family:{{Z}};font-size:13px;font-weight:500;color:{{K.mu}}">écartée</span></sc-if><sc-if value="{{s.hasPips}}" hint-placeholder-val="{{true}}"><span role="img" aria-label="{{s.tip}}" style="display:flex;gap:2px;width:48px;flex:none"><sc-for list="{{s.pips}}" as="q" hint-placeholder-count="5"><span style="width:8px;height:6px;flex:none;box-sizing:border-box;border-radius:1.5px;background:{{q.bg}};border:1.2px solid {{q.ring}}"></span></sc-for></span></sc-if><span title="{{s.tip}}" style="flex:1;min-width:0;font-family:{{M}};font-size:12px;font-weight:400;color:{{s.fg}};white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{s.slug}}</span><sc-if value="{{s.blocked}}" hint-placeholder-val="{{false}}"><svg role="img" aria-label="1 blocage" width="12" height="12" viewBox="0 0 12 12" style="flex:none"><circle cx="6" cy="6" r="5.6" fill="{{K.blk}}"></circle><rect x="3" y="5.1" width="6" height="1.8" rx="0.9" fill="#ffffff"></rect></svg></sc-if><sc-if value="{{s.hasCross}}" hint-placeholder-val="{{false}}"><span style="flex:none;display:flex;align-items:center;gap:4px;font-size:11px;font-weight:500;color:{{K.blkT}};white-space:nowrap"><svg aria-hidden="true" width="11" height="11" viewBox="0 0 12 12" style="flex:none"><circle cx="6" cy="6" r="5.6" fill="{{K.blk}}"></circle><rect x="3" y="5.1" width="6" height="1.8" rx="0.9" fill="#ffffff"></rect></svg>{{s.crossLabel}}</span></sc-if></div></sc-for>
</div>
<sc-if value="{{hasCmd}}" hint-placeholder-val="{{true}}"><div style="position:relative;display:flex;align-items:center;gap:6px;height:34px;flex:none;box-sizing:border-box;padding:0 4px 0 14px;border-top:1.5px dashed {{K.cardBd}};background:{{K.stub}}">
<span aria-hidden="true" style="position:absolute;left:-7px;top:-7px;width:14px;height:14px;border-radius:50%;background:{{K.board}}"></span>
<span aria-hidden="true" style="position:absolute;right:-7px;top:-7px;width:14px;height:14px;border-radius:50%;background:{{K.board}}"></span>
<code title="{{cmd}}" style="flex:1;min-width:0;font-family:{{M}};font-size:11px;color:{{K.fg}};white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{cmd}}</code>
<button type="button" aria-label="Copier la commande" style="width:26px;height:26px;flex:none;padding:0;display:flex;align-items:center;justify-content:center;border:0;border-radius:5px;background:transparent;color:{{K.mu}};cursor:pointer"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"><rect x="4.6" y="4.6" width="7.2" height="7.2" rx="1.6"></rect><path d="M9.4 4.6v-.8a1.6 1.6 0 0 0-1.6-1.6h-4a1.6 1.6 0 0 0-1.6 1.6v4a1.6 1.6 0 0 0 1.6 1.6h.8"></path></svg></button>
</div></sc-if>
</sc-if>

<sc-if value="{{folded}}" hint-placeholder-val="{{false}}">
<div style="flex:1;box-sizing:border-box;display:flex;flex-direction:column;justify-content:center;gap:3px;padding:0 9px 0 7px">
<div style="display:flex;align-items:center;gap:5px;height:18px">
<svg aria-hidden="true" width="16" height="16" viewBox="0 0 20 20" style="flex:none"><circle cx="10" cy="10" r="8.7" fill="none" stroke="{{K.acc}}" stroke-width="2.2" opacity="{{ringOp}}"></circle><circle cx="10" cy="10" r="5.4" fill="{{mkFill}}" stroke="{{mkStroke}}" stroke-width="2.6" stroke-dasharray="{{mkDash}}"></circle><path d="M7.7 10.2 9.3 11.7 12.4 8.5" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="{{checkOp}}"></path></svg>
<span style="font-family:{{M}};font-size:11px;font-weight:700;color:{{chipCol}};white-space:nowrap">{{chip}}</span>
<span style="font-family:{{Z}};font-size:13.5px;font-weight:600;color:{{w1Col}};white-space:nowrap">{{w1}}</span>
</div>
<div style="display:flex;align-items:center;gap:5px;height:16px;padding-left:2px">
<sc-if value="{{isTenu}}" hint-placeholder-val="{{false}}"><svg aria-hidden="true" width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="{{K.mu}}" stroke-width="1.3" stroke-linecap="round" style="flex:none"><rect x="2.6" y="5.3" width="6.8" height="4.9" rx="1.2"></rect><path d="M4.2 5.3V4a1.8 1.8 0 0 1 3.6 0v1.3"></path></svg></sc-if>
<sc-if value="{{hasMini}}" hint-placeholder-val="{{false}}"><span role="img" aria-label="{{miniLabel}}" style="display:flex;gap:2px"><sc-for list="{{mini}}" as="m" hint-placeholder-count="2"><span style="width:10px;height:5px;border-radius:1.5px;background:{{m.bg}}"></span></sc-for></span></sc-if>
<sc-if value="{{pillBlock}}" hint-placeholder-val="{{false}}"><svg aria-hidden="true" width="10" height="10" viewBox="0 0 12 12" style="flex:none"><circle cx="6" cy="6" r="5.6" fill="{{K.blk}}"></circle><rect x="3" y="5.1" width="6" height="1.8" rx="0.9" fill="#ffffff"></rect></svg></sc-if>
<span style="font-family:{{Z}};font-size:13px;font-weight:500;color:{{w2Col}};white-space:nowrap">{{w2}}</span>
</div>
</div>
</sc-if>

</div>
<sc-if value="{{hasStep}}" hint-placeholder-val="{{false}}"><span title="{{stepTitle}}" style="position:absolute;z-index:2;left:-10px;top:-10px;width:22px;height:22px;box-sizing:border-box;border-radius:50%;border:2px solid {{K.card}};background:{{K.fg}};color:{{K.card}};font-family:{{Z}};font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center">{{etape}}</span></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["clair","sombre"],"default":"clair"},"etat":{"editor":"enum","options":["courant","fait","tenu","hors"],"default":"courant"},"ouvert":{"editor":"boolean","default":true},"ligne":{"editor":"enum","options":["sarcelle","ocre"],"default":"sarcelle"},"bid":{"editor":null},"actif":{"editor":null},"par":{"editor":null},"entete":{"editor":null},"stories":{"editor":null},"nb":{"editor":null},"notes":{"editor":null},"cmd":{"editor":null},"etape":{"editor":null},"estompe":{"editor":null},"$preview":{"width":320,"height":184}}'>
class Component extends DCLogic {
  tok(dark) {
    if (dark) {
      return {board:'#141c26', card:'#1d2733', cardBd:'#33414f', stub:'#18212b', fg:'#eef2f6', fg2:'#cdd6df', mu:'#9fadbc', grey:'#66768a', greyL:'#3a4858', acc:'#f0abfc', accT:'#f5c2fd', done:'#93c5fd', blk:'#f87171', blkT:'#fca5a5', sh:'0 1px 0 #0b1118, 0 3px 10px rgba(0,0,0,0.45)', lines:{sarcelle:'#3cc4b6', ocre:'#f0a443'}};
    }
    return {board:'#f1ecdd', card:'#fffdf7', cardBd:'#d8cfb9', stub:'#f8f4e8', fg:'#1f1d1a', fg2:'#3f3a33', mu:'#6b6458', grey:'#9b9384', greyL:'#d3cbba', acc:'#c026d3', accT:'#a21caf', done:'#1d4ed8', blk:'#dc2626', blkT:'#b91c1c', sh:'0 1px 0 #d8cfb9, 0 3px 8px rgba(70,52,20,0.12)', lines:{sarcelle:'#137a72', ocre:'#b46a12'}};
  }
  row(slug, n, o, K, line, tenu) {
    var labels = {'-1':'écartée','0':'à écrire','1':'sans design','1.5':'design en brouillon','2':'design approuvé, à coder','3':'code fini, à valider puis soumettre','4':'soumise','5':'terminée'};
    var on = tenu ? K.grey : line;
    var pips = [];
    for (var i = 1; i <= 5; i++) {
      var full = n >= i;
      var half = !full && n >= i - 0.5;
      pips.push({bg: full ? on : (half ? 'linear-gradient(90deg, ' + on + ' 50%, transparent 50%)' : 'transparent'), ring: on});
    }
    var cross = o.cross || 0;
    var near = cross > 0 && cross <= 3;
    var tip = (labels[String(n)] || '') + ' · ' + Math.floor(Math.max(0, n)) + ' wagon' + (n >= 2 ? 's' : '') + ' sur 5';
    if (o.block || cross > 3) tip = tip + ' · 1 blocage';
    if (near) tip = tip + ' · dépend d’une autre epic, ' + cross + ' batch' + (cross > 1 ? 's' : '') + ' à débloquer';
    return {slug: slug, n: n, pips: pips, aside: n < 0, hasPips: n >= 0, op: n < 0 ? 0.5 : 1, fg: tenu ? K.mu : K.fg, blocked: !!o.block || cross > 3, hasCross: near, crossLabel: cross + ' à débloquer', tip: tip};
  }
  renderVals() {
    var p = this.props;
    var self = this;
    var dark = p.theme === 'sombre' || p.theme === 'dark';
    var K = this.tok(dark);
    var line = K.lines[p.ligne] || K.lines.sarcelle;
    var std = p.bid == null;
    var bid = std ? 'B1' : String(p.bid);
    var etat = p.etat || 'courant';
    var actif = p.actif !== 'non';
    var par = String(p.par || '');
    var entete = String(p.entete || '');
    var spec = std ? 'compound-inventory:0|plugin-split:1.5:x2|shared-skills:2|marketplace-manifest:3' : String(p.stories || '');
    var cmd = std ? 'storyman compound-inventory' : String(p.cmd || '');
    var etape = String(p.etape || '');
    var open = p.ouvert == null ? std : (p.ouvert === true || p.ouvert === 'oui');
    var isCur = etat === 'courant', isTenu = etat === 'tenu', isFait = etat === 'fait', isHors = etat === 'hors';
    var quiet = isTenu || isHors;
    var rows = [];
    if (spec) {
      spec.split('|').forEach(function (item) {
        var parts = item.split(':');
        var nn = parseFloat(parts[1]);
        var fl = parts[2] || '';
        var mx = fl.match(/x(\d+)/);
        rows.push(self.row(parts[0], isNaN(nn) ? 0 : nn, {block: fl.indexOf('b') >= 0, cross: mx ? parseInt(mx[1], 10) : 0}, K, line, quiet));
      });
    }
    var n = rows.length || parseInt(p.nb, 10) || 0;
    var notes = parseInt(p.notes, 10) || 0;
    var blocks = rows.filter(function (r) { return r.blocked || r.hasCross; }).length;
    var live = rows.filter(function (r) { return r.n >= 0; });
    var mini = live.map(function (r) {
      var pc = Math.round(r.n / 5 * 100);
      return {bg: 'linear-gradient(90deg, ' + line + ' ' + pc + '%, ' + K.greyL + ' ' + pc + '%)'};
    });
    var count = n + (n > 1 ? ' stories' : ' story') + (notes ? (' · ' + notes + (notes > 1 ? ' notes' : ' note')) : '');
    var blockLabel = blocks + (blocks > 1 ? ' blocages' : ' blocage');
    var hasCmd = cmd !== '' && isCur;
    var bandH = open ? 6 : 4;
    var w = open ? 320 : (isCur ? 150 : 104);
    var h = open ? (bandH + 34 + (entete ? 22 : 0) + rows.length * 26 + 6 + (hasCmd ? 34 : 0)) : 52;
    var word = isCur ? 'courant' : (isFait ? 'fait' : (isTenu ? ('tenu par ' + par) : ''));
    var wordCol = isCur ? (actif ? K.accT : K.fg2) : (isFait ? K.done : K.mu);
    return {
      K: K,
      M: "'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace",
      Z: "'Zilla Slab', 'Rockwell', 'Roboto Slab', Georgia, serif",
      open: open,
      folded: !open,
      w: w,
      h: h,
      bandH: bandH,
      bandBg: quiet ? 'transparent' : line,
      cardBg: quiet ? 'transparent' : K.card,
      cardBd: quiet ? ('1.5px dashed ' + K.grey) : ('1px solid ' + K.cardBd),
      cardSh: quiet ? 'none' : K.sh,
      ringOp: (isCur && actif) ? 1 : 0,
      mkFill: isFait ? line : K.card,
      mkStroke: quiet ? K.grey : line,
      mkDash: quiet ? '2.4 2' : 'none',
      checkOp: isFait ? 1 : 0,
      op: p.estompe === 'oui' ? 0.35 : 1,
      chip: isHors ? 'HORS BATCH' : bid,
      chipCol: quiet ? K.mu : K.fg,
      isTenu: isTenu,
      word: word,
      wordCol: wordCol,
      hasMini: mini.length > 0 && !isTenu,
      mini: mini,
      miniLabel: 'avancement des ' + mini.length + ' stories',
      count: count,
      hasBlock: blocks > 0,
      blockLabel: blockLabel,
      hasEntete: entete !== '',
      entete: entete,
      rows: rows,
      hasCmd: hasCmd,
      cmd: cmd,
      w1: isTenu ? count : word,
      w1Col: isTenu ? K.mu : wordCol,
      w2: isTenu ? ('tenu par ' + par) : ((isCur && blocks) ? blockLabel : count),
      w2Col: (isCur && blocks) ? K.blkT : K.mu,
      pillBlock: isCur && blocks > 0,
      hasStep: etape !== '',
      etape: etape,
      stepTitle: 'étape ' + etape + ' du chemin de déblocage'
    };
  }
}
</script>
</body>
</html>
