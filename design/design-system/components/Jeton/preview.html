<!doctype html>
<html lang="fr">
<head>

<style>

.demo { padding: 24px; display: flex; flex-wrap: wrap; align-items: flex-start; gap: 24px; }

<div class="rt demo" style="flex-direction:column;gap:16px">
<div><span class="lbl">Puces de tuile : OQ, aucune OQ, RLOQ, blocage</span><div style="display:flex;gap:8px;align-items:center;padding:10px 12px;border-radius:var(--radius-tuile);background:var(--tuile-en-cours)"><span class="rt-puce rt-puce--oq">3 OQ</span><span class="rt-puce rt-puce--oq-ok">OQ ✓</span><span class="rt-puce rt-puce--rloq rt-puce--icone" title="1 RLOQ"><svg aria-hidden="true" width="11" height="11" viewBox="0 0 14 14"><circle cx="7" cy="7" r="6.6" style="fill:var(--rloq-texte)"></circle><path d="M5.3 5.4a1.8 1.8 0 1 1 2.6 1.6c-.6.3-.9.7-.9 1.3v.3" fill="none" stroke-width="1.6" stroke-linecap="round" style="stroke:var(--rloq)"></path><circle cx="7" cy="10.4" r=".9" style="fill:var(--rloq)"></circle></svg>1</span><span class="rt-puce rt-puce--rloq">1 RLOQ</span><span class="rt-puce rt-puce--blocage"><svg aria-hidden="true" width="11" height="11" viewBox="0 0 12 12"><circle cx="6" cy="6" r="5.6" style="fill:var(--surface)"></circle><rect x="3" y="5.1" width="6" height="1.8" rx="0.9" style="fill:var(--blocage)"></rect></svg>1</span><svg role="img" aria-label="RLOQ" width="14" height="14" viewBox="0 0 14 14" style="flex:none"><circle cx="7" cy="7" r="6.6" style="fill:var(--rloq)"></circle><path d="M5.3 5.4a1.8 1.8 0 1 1 2.6 1.6c-.6.3-.9.7-.9 1.3v.3" fill="none" stroke-width="1.5" stroke-linecap="round" style="stroke:var(--rloq-texte)"></path><circle cx="7" cy="10.4" r=".85" style="fill:var(--rloq-texte)"></circle></svg></div></div>
<div><span class="lbl">Pastilles : en cours, epic bloquée, fait</span><div style="display:flex;gap:14px;padding:10px 12px;border-radius:var(--radius-tuile);background:var(--tuile-en-cours)">
<span class="rt-pastille rt-pastille--en-cours" style="position:static"><svg role="img" aria-label="en cours" width="13" height="13" viewBox="0 0 14 14"><path d="M3.4 2.6h7.4l1.4 3H2Z" style="fill:var(--surface)"></path><path d="M7.1 5.8v6.6" stroke-width="2" stroke-linecap="round" style="stroke:var(--surface)"></path></svg></span><span class="rt-pastille rt-pastille--bloquee" style="position:static"><svg role="img" aria-label="en cours" width="13" height="13" viewBox="0 0 14 14"><path d="M3.4 2.6h7.4l1.4 3H2Z" style="fill:var(--surface)"></path><path d="M7.1 5.8v6.6" stroke-width="2" stroke-linecap="round" style="stroke:var(--surface)"></path></svg></span><span class="rt-pastille rt-pastille--faite" style="position:static"><svg role="img" aria-label="fait" width="14" height="14" viewBox="0 0 14 14"><path d="M4.3 12.8V1.8" stroke-width="1.5" stroke-linecap="round" style="stroke:var(--fait-fonce)"></path><path d="M4.6 2.2h6.6L9.5 4.7l1.7 2.5H4.6Z" stroke-width="0.8" stroke-linejoin="round" style="fill:var(--fait);stroke:var(--fait-fonce)"></path></svg></span></div></div>
<div><span class="lbl">Dans le chantier</span><div class="rt-chantier" style="flex-direction:row;flex-wrap:wrap;align-items:center;gap:10px;padding:12px 16px">
<span class="rt-etat rt-etat--en-cours"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 14 14"><circle cx="7" cy="7" r="6.6" style="fill:var(--accent)"></circle><path d="M4.2 3.6h5.6l1 2.2H3.2Z" style="fill:var(--surface)"></path><path d="M7 5.9v4.8" stroke-width="1.6" stroke-linecap="round" style="stroke:var(--surface)"></path></svg>en cours</span><span class="rt-etat rt-etat--fait"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 14 14"><path d="M4.3 12.8V1.8" stroke-width="1.5" stroke-linecap="round" style="stroke:var(--fait-fonce)"></path><path d="M4.6 2.2h6.6L9.5 4.7l1.7 2.5H4.6Z" stroke-width="0.8" stroke-linejoin="round" style="fill:var(--fait);stroke:var(--fait-fonce)"></path></svg>fait</span><span class="rt-etat rt-etat--tenu"><svg aria-hidden="true" width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><rect x="2.6" y="5.3" width="6.8" height="4.9" rx="1.1"></rect><path d="M4.2 5.3V4a1.8 1.8 0 0 1 3.6 0v1.3"></path></svg>tenu par B1</span><span class="rt-etat rt-etat--hors-batch">hors batch</span>
