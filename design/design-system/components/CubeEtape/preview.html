<!-- @dsCard group="Plateau" height=380 subtitle="Sur une tuile, puis dans les cases du chantier" -->
<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<style>
body { margin: 0; background: var(--surface-plan); }
.demo { padding: 24px; display: flex; flex-wrap: wrap; align-items: flex-start; gap: 24px; }
.lbl { display: block; margin-bottom: 8px; font-size: 11px; font-weight: 600; color: var(--encre-muette); }
</style>
</head>
<body>
<div class="rt demo" style="flex-direction:column;gap:18px">
<div><span class="lbl">Sur une tuile</span><div style="display:flex;gap:18px;padding:14px 16px;border-radius:var(--radius-tuile);background:var(--tuile-en-cours)"><span style="display:flex;flex-direction:column;align-items:center;gap:6px;font-size:10.5px;color:var(--tuile-muette)"><span class="rt-cube rt-cube--a-ecrire"></span>à écrire</span><span style="display:flex;flex-direction:column;align-items:center;gap:6px;font-size:10.5px;color:var(--tuile-muette)"><span class="rt-cube rt-cube--ecrite"></span>écrite</span><span style="display:flex;flex-direction:column;align-items:center;gap:6px;font-size:10.5px;color:var(--tuile-muette)"><span class="rt-cube rt-cube--ecrite"></span>design en brouillon</span><span style="display:flex;flex-direction:column;align-items:center;gap:6px;font-size:10.5px;color:var(--tuile-muette)"><span class="rt-cube rt-cube--design"></span>design approuvé</span><span style="display:flex;flex-direction:column;align-items:center;gap:6px;font-size:10.5px;color:var(--tuile-muette)"><span class="rt-cube rt-cube--code"></span>code fini</span><span style="display:flex;flex-direction:column;align-items:center;gap:6px;font-size:10.5px;color:var(--tuile-muette)"><span class="rt-cube rt-cube--soumise"></span>soumise</span><span style="display:flex;flex-direction:column;align-items:center;gap:6px;font-size:10.5px;color:var(--tuile-muette)"><span class="rt-cube rt-cube--terminee"><svg aria-hidden="true" width="9" height="9" viewBox="0 0 10 10"><path d="M2 5.2 4.1 7.2 8 2.9" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="stroke:var(--surface)"></path></svg></span>terminée</span></div></div>
<div><span class="lbl">Dans le chantier : écrite, design, code, soumise, terminée</span><div class="rt-chantier" style="gap:6px;padding:12px 16px;width:560px"><div class="rt-grille rt-grille--ligne" style="grid-template-columns:minmax(0,1fr) repeat(5, 40px)"><span class="rt-slug" style="font-family:var(--font-sans);font-size:11px;color:var(--chantier-titre)">écrite</span><span class="rt-case"><span class="rt-cube rt-cube--ecrite"></span></span><span class="rt-case"></span><span class="rt-case"></span><span class="rt-case"></span><span class="rt-case"></span></div><div class="rt-grille rt-grille--ligne" style="grid-template-columns:minmax(0,1fr) repeat(5, 40px)"><span class="rt-slug" style="font-family:var(--font-sans);font-size:11px;color:var(--chantier-titre)">design en brouillon</span><span class="rt-case"><span class="rt-cube rt-cube--ecrite"></span></span><span class="rt-case"><span class="rt-cube rt-cube--moitie rt-cube--design"></span></span><span class="rt-case"></span><span class="rt-case"></span><span class="rt-case"></span></div><div class="rt-grille rt-grille--ligne" style="grid-template-columns:minmax(0,1fr) repeat(5, 40px)"><span class="rt-slug" style="font-family:var(--font-sans);font-size:11px;color:var(--chantier-titre)">design approuvé</span><span class="rt-case"><span class="rt-cube rt-cube--ecrite"></span></span><span class="rt-case"><span class="rt-cube rt-cube--design"></span></span><span class="rt-case"></span><span class="rt-case"></span><span class="rt-case"></span></div><div class="rt-grille rt-grille--ligne" style="grid-template-columns:minmax(0,1fr) repeat(5, 40px)"><span class="rt-slug" style="font-family:var(--font-sans);font-size:11px;color:var(--chantier-titre)">code fini</span><span class="rt-case"><span class="rt-cube rt-cube--ecrite"></span></span><span class="rt-case"><span class="rt-cube rt-cube--design"></span></span><span class="rt-case"><span class="rt-cube rt-cube--code"></span></span><span class="rt-case"></span><span class="rt-case"></span></div><div class="rt-grille rt-grille--ligne" style="grid-template-columns:minmax(0,1fr) repeat(5, 40px)"><span class="rt-slug" style="font-family:var(--font-sans);font-size:11px;color:var(--chantier-titre)">soumise</span><span class="rt-case"><span class="rt-cube rt-cube--ecrite"></span></span><span class="rt-case"><span class="rt-cube rt-cube--design"></span></span><span class="rt-case"><span class="rt-cube rt-cube--code"></span></span><span class="rt-case"><span class="rt-cube rt-cube--soumise"></span></span><span class="rt-case"></span></div></div></div>
</div>
</body>
</html>
